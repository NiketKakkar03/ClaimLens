services:
  inference-api:
    build: .
    environment:
      CLAIMS_MODEL_PATH: /app/artifacts/model/model.joblib
    ports:
      - "${CLAIMS_API_PORT:-8010}:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
  lakehouse:
    profiles: ["data"]
    build:
      context: .
      dockerfile: Dockerfile.spark
    volumes:
      - ./data/generated:/app/data/generated:ro
      - ./data/lakehouse:/app/data/lakehouse
      - spark-ivy-v2:/home/sparkuser/.ivy2.5.2

volumes:
  spark-ivy-v2:
