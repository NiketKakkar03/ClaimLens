[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claims-intelligence"
version = "0.1.0"
description = "Local-first claims severity ML platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.6,<2",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]
training = [
  "mlflow>=3.0,<4",
]
spark = [
  "delta-spark>=4,<5",
  "pyspark>=4,<5",
]

[project.scripts]
claims-intelligence = "claims_intelligence.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/claims_intelligence"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

