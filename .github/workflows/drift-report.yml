name: Scheduled drift report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --extra training
      - run: uv run claims-intelligence build-local --claims 1000 --policies 500
      - run: uv run claims-intelligence drift-report
      - uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: artifacts/monitoring/
          retention-days: 14
